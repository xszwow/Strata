    <body class="chat-app">
        <button
            id="history-btn"
            class="icon-button sidebar-toggle"
            aria-label="打开历史记录"
            aria-expanded="false"
            aria-controls="history-panel"
        >
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <path d="M9 3v18" />
            </svg>
        </button>
        <main class="chat-container" id="chat-container" aria-label="对话内容"></main>
        <footer class="input-area">
            <div id="conversation-tasks" class="conversation-tasks" hidden>
                <div id="task-card" class="task-card">
                    <button type="button" id="task-entry" class="task-entry" hidden aria-expanded="false" aria-controls="task-panel">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 6 2 2 4-4M12 6h9M3 13h2M8 13h13M3 20h2M8 20h13" /></svg>
                        <span id="task-entry-label" aria-live="polite" aria-atomic="true"></span>
                        <span id="task-entry-action">展开</span>
                        <svg class="task-entry-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m7 14 5-5 5 5" /></svg>
                    </button>
                    <section id="task-panel" class="task-panel" aria-label="本次会话待办" hidden>
                        <ul id="task-panel-list" class="task-panel-list" aria-label="待办清单" tabindex="0"></ul>
                    </section>
                </div>
            </div>
            <div class="input-container">
                <div class="composer-attachment" id="composer-attachment" hidden>
                    <button class="composer-control" id="preview-btn" aria-label="预览附件">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M6 3h8l4 4v14H6z M14 3v5h5M9 12h6M9 16h6" /></svg
                        ><span id="attachment-name"></span>
                    </button>
                    <button class="composer-control" id="remove-file-button" aria-label="移除附件">
                        <svg data-llama-icon="x" aria-hidden="true"></svg>
                    </button>
                </div>
                <textarea id="user-input" aria-label="消息" placeholder="发送消息…" rows="1"></textarea>
                <div class="composer-toolbar">
                    <input type="file" id="file-input" class="file-input" accept=".docx,.xlsx,.xls,.pdf" />
                    <button
                        class="composer-control composer-add"
                        id="upload-btn"
                        aria-label="上传文件"
                        title="添加 Word、Excel 或 PDF"
                    >
                        <svg data-llama-icon="plus" aria-hidden="true"></svg>
                    </button>
                    <div class="composer-tools">
                        <div class="composer-model-tools">
                            <button
                                class="composer-control"
                                id="context-button"
                                aria-label="上下文窗口"
                                aria-haspopup="dialog"
                                aria-expanded="false"
                                aria-controls="composer-panel"
                            >
                                <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                                    <circle class="context-track" cx="16" cy="16" r="11" stroke-width="3" />
                                    <circle
                                        id="context-ring"
                                        cx="16"
                                        cy="16"
                                        r="11"
                                        stroke-width="3"
                                        stroke-linecap="round"
                                    />
                                </svg>
                            </button>
                            <button
                                class="composer-control composer-reasoning"
                                id="reasoning-button"
                                aria-label="推理强度"
                                aria-haspopup="dialog"
                                aria-expanded="false"
                                aria-controls="composer-panel"
                            >
                                <svg data-llama-icon="lightbulb" aria-hidden="true"></svg
                                ><span id="reasoning-label"></span>
                            </button>
                            <button
                                class="composer-control composer-model"
                                id="model-button"
                                aria-label="当前模型"
                                aria-haspopup="dialog"
                                aria-expanded="false"
                                aria-controls="composer-panel"
                            >
                                <svg data-llama-icon="package" aria-hidden="true"></svg
                                ><span id="model-name">读取模型…</span>
                            </button>
                        </div>
                        <button
                            class="composer-control composer-submit"
                            id="send-button"
                            aria-label="发送"
                            disabled
                        >
                            <svg data-llama-icon="arrow-up" aria-hidden="true"></svg>
                        </button>
                        <button
                            class="composer-control composer-submit"
                            id="stop-button"
                            style="display: none"
                            aria-label="停止生成"
                        >
                            <svg data-llama-icon="square" aria-hidden="true"></svg>
                        </button>
                    </div>
                </div>
            </div>
        </footer>
        <dialog
            id="composer-panel"
            popover="auto"
            class="composer-panel"
            aria-labelledby="composer-panel-title"
        ></dialog>
        <dialog class="mermaid-overlay" id="mermaid-overlay" aria-labelledby="viewer-title">
            <div class="mermaid-large">
                <header class="viewer-header">
                    <div class="viewer-heading">
                        <h2 id="viewer-title">图表</h2>
                        <p id="viewer-description">拖动查看 · 滚轮或双指缩放</p>
                    </div>
                    <div class="viewer-header-actions">
                        <div id="viewer-actions"></div>
                        <button
                            class="icon-button close-btn"
                            onclick="closeMermaidOverlay()"
                            aria-label="关闭全屏"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path d="m6 6 12 12M6 18 18 6" />
                            </svg>
                        </button>
                    </div>
                </header>
                <div class="mermaid-content" tabindex="0" aria-label="图表查看区"></div>
                <div class="zoom-controls">
                    <button class="zoom-btn" onclick="adjustZoom(-0.2)" aria-label="缩小">−</button
                    ><span class="zoom-level" aria-live="polite">100%</span>
                    <button class="zoom-btn" onclick="adjustZoom(0.2)" aria-label="放大">+</button>
                    <button class="fit-view-btn" onclick="fitDiagram()">适应屏幕</button
                    ><button class="reset-view-btn" onclick="resetZoom()" title="重置为原始大小">100%</button>
                </div>
            </div>
        </dialog>
        <div class="history-overlay" id="history-overlay"></div>
        <aside class="history-panel" id="history-panel" aria-label="历史记录" inert>
            <div class="history-header">
                <h2>你的对话</h2>
                <button class="icon-button history-close" aria-label="关闭历史记录">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="m6 6 12 12M6 18 18 6" />
                    </svg>
                </button>
            </div>
            <div class="history-tools">
                <button class="new-chat-btn">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M12 5v14M5 12h14" /></svg
                    >新建对话</button
                ><button class="icon-button danger-btn" title="清空历史" aria-label="清空历史">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7M14 10v7" />
                    </svg>
                </button>
            </div>
            <div class="history-content"><div class="chat-list"></div></div>
            <div class="history-account">
                <span id="free-quota" class="free-quota" title="剩余免费对话次数"></span>
                <button
                    id="settings-btn"
                    class="text-button"
                    onclick="location.href = 'settings.html'"
                    aria-label="设置"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path
                            d="M9 4h6l1 3 3 1v8l-3 1-1 3H9l-1-3-3-1V8l3-1z M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"
                        /></svg
                    ><span>设置</span>
                </button>
            </div>
        </aside>
        <div class="file-progress" role="progressbar" aria-label="文件处理中">
            <div class="file-progress-bar"></div>
        </div>
        <div class="file-preview-overlay"></div>
        <section class="file-preview" role="dialog" aria-label="附件预览">
            <button class="file-preview-close" aria-label="关闭附件预览">×</button>
            <div class="file-preview-content"></div>
        </section>
    </body>
</html>
